[package]
name = "tvc"
version = "1.1.0"
edition = "2021"

[features]
default = []
onnx-inference = ["dep:ort"]

[dependencies]
clap = { version = "4", features = ["derive"] }
litemap = "=0.7.4"
zerofrom = "=0.1.5"
rust-htslib = "0.49"
bio = "1.4"
statrs = "0.16"
rayon = "1.7"
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "api-24"] }