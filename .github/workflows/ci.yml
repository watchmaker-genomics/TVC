name: CI/CD Docker + Binaries + Release

on:
  push:
    branches:
      - ci_testing           # Run full pipeline on this branch for testing
    tags:
      - 'v*.*.*'             # Run full release pipeline on version tags
  pull_request:
    branches:
      - main                 # Run gated checks on PRs to main
  workflow_dispatch:         # Allow manual runs

jobs:
  # ======================
  # Run Rust Tests
  # ======================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Install clippy
        run: rustup component add clippy
      - name: Pull Git LFS files
        run: git lfs pull

      - name: Run cargo fmt check
        run: cargo fmt -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

      - name: Run cargo unit tests
        run: cargo test --all --locked --verbose


  # ======================
  # Build Multi-Arch Rust Binaries
  # ======================
  build-binaries:
    needs: test
    runs-on: ${{ matrix.os }}

    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/ci_testing'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_suffix: -static
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify static linkage (musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          file target/${{ matrix.target }}/release/tvc
          ldd target/${{ matrix.target }}/release/tvc || true
          if objdump -T target/${{ matrix.target }}/release/tvc 2>/dev/null | grep -q GLIBC; then
            echo "ERROR: binary has GLIBC symbol references"
            exit 1
          fi
          echo "OK: no GLIBC references"

      - name: Package binary
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/tvc release/tvc
          tar -czf tvc-${{ matrix.target }}${{ matrix.artifact_suffix }}.tar.gz -C release tvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvc-${{ matrix.target }}${{ matrix.artifact_suffix }}
          path: tvc-${{ matrix.target }}${{ matrix.artifact_suffix }}.tar.gz


