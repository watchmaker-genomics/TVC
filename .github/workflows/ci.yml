  # ======================
  #  Create GitHub Release (only for tags)
  # ======================
  release:
    needs: [build-binaries]  # build-and-push temporarily removed for ci_testing dry run
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      # Download Linux artifact
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: tvc-x86_64-unknown-linux-gnu
          path: ./artifacts/linux

      # Download Linux static (musl) artifact
      - name: Download Linux static (musl) artifact
        uses: actions/download-artifact@v4
        with:
          name: tvc-x86_64-unknown-linux-musl-static
          path: ./artifacts/linux-static

      # Download macOS x86_64 artifact
      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: tvc-x86_64-apple-darwin
          path: ./artifacts/macos-x86_64

      # Download macOS ARM artifact
      - name: Download macOS ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: tvc-aarch64-apple-darwin
          path: ./artifacts/macos-arm

      # Create GitHub release
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/linux/**/*.tar.gz
            ./artifacts/linux-static/**/*.tar.gz
            ./artifacts/macos-x86_64/**/*.tar.gz
            ./artifacts/macos-arm/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

